<!DOCTYPE html>
<html>
<head>
    <title>Benim 3D Dünyam</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        
        // ===== SAHNE KURULUMU =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        // ===== IŞIKLANDIRMA =====
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);
        
        // ===== OBJELER =====
        // 1. Dönen KÜP
        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ff88,
            metalness: 0.3,
            roughness: 0.4,
            emissive: new THREE.Color(0x00ff88),
            emissiveIntensity: 0.1
        });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        
        // 2. Yörüngede dönen KÜRE
        const sphereGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: new THREE.Color(0xff6b6b), emissiveIntensity: 0.3 });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(sphere);
        
        // 3. Parçacık Sistemi (Yıldızlar)
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 1000;
        const positions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 100;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);
        
        // ===== ANİMASYON =====
        function animate() {
            requestAnimationFrame(animate);
            
            // Küp dönüyor
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.02;
            
            // Küre yörüngede dönüyor
            const time = Date.now() / 1000;
            sphere.position.x = Math.sin(time) * 2;
            sphere.position.z = Math.cos(time) * 2;
            
            // Yıldızlar yavaşça dönüyor
            stars.rotation.y += 0.0002;
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // ===== PENCERE YENİDEN BOYUTLANDIRMA =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
